name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$'
          if (-not $line) { throw 'Could not read a valid version from pubspec.yaml.' }
          $manifestVersion = $line.Matches[0].Groups[1].Value
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -ne $manifestVersion) {
            throw "Release tag $tagVersion does not match pubspec.yaml version $manifestVersion."
          }

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $flutterBin = "$env:RUNNER_TEMP\flutter\bin"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          & "$flutterBin\flutter.bat" --version
          $dart = & "$flutterBin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dart
          if ($dart -notmatch 'windows_arm64') { throw "Flutter picked a non-arm64 Dart SDK: $dart" }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Package portable build
        shell: pwsh
        run: |
          $releaseDir = "build\windows\${{ matrix.arch }}\runner\Release"
          if (-not (Test-Path (Join-Path $releaseDir 'KeyFix.exe'))) { throw "KeyFix.exe was not found in $releaseDir." }
          if (-not (Get-ChildItem -Path $releaseDir -File -Recurse | Select-Object -First 1)) { throw "Release directory is empty: $releaseDir" }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath "KeyFix-windows-${{ matrix.arch }}.zip" -CompressionLevel Optimal
          if ((Get-Item "KeyFix-windows-${{ matrix.arch }}.zip").Length -le 0) { throw 'Portable ZIP is empty.' }

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          KEYFIX_ARCH: ${{ matrix.arch }}
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$'
          if (-not $line) { throw 'Could not read a valid version from pubspec.yaml.' }
          $version = $line.Matches[0].Groups[1].Value
          $env:KEYFIX_VERSION = $version

          function Find-Iscc {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }

            $roots = @(
              ${env:ProgramFiles(x86)},
              $env:ProgramFiles,
              (Join-Path $env:LOCALAPPDATA 'Programs')
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $roots) {
              foreach ($dir in Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue) {
                $candidate = Join-Path $dir.FullName 'ISCC.exe'
                if (Test-Path $candidate) { return $candidate }
              }
            }

            if ($env:ChocolateyInstall) {
              $found = Get-ChildItem -Path (Join-Path $env:ChocolateyInstall 'lib') -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { return $found.FullName }
            }

            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Get-ChildItem -Path ${env:ProgramFiles(x86)}, $env:ProgramFiles -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw 'Inno Setup compiler was not found.'
          }

          Write-Host "Using $iscc"
          & $iscc /Qp KeyFix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "Output\KeyFix-Setup-$env:KEYFIX_ARCH.exe")) { throw 'Installer was not produced.' }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: KeyFix-windows-${{ matrix.arch }}
          path: |
            KeyFix-windows-${{ matrix.arch }}.zip
            Output/KeyFix-Setup-${{ matrix.arch }}.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml | head -n1)
          test -n "$version" || { echo 'Could not read pubspec.yaml version.'; exit 1; }
          test "${RELEASE_TAG#v}" = "$version" || { echo "Release tag ${RELEASE_TAG#v} does not match pubspec.yaml version $version."; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Generate macOS runner
        run: |
          flutter create --platforms=macos --project-name keyfix --org app.keyfix .
          rm -f test/widget_test.dart
          cp ci/macos/AppDelegate.swift macos/Runner/AppDelegate.swift
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = KeyFix/' macos/Runner/Configs/AppInfo.xcconfig
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c 'Set :com.apple.security.app-sandbox false' "$f"
          done
          icons=macos/Runner/Assets.xcassets/AppIcon.appiconset
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size docs/logo.png --out "$icons/app_icon_$size.png" >/dev/null
          done

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build macos --release

      - name: Package
        run: |
          app="build/macos/Build/Products/Release/KeyFix.app"
          test -d "$app" || { echo "macOS app bundle not found: $app"; exit 1; }
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" KeyFix-macos.zip
          mkdir dmg && cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname KeyFix -srcfolder dmg -ov -format UDZO KeyFix-macos.dmg
          test -s KeyFix-macos.zip && test -s KeyFix-macos.dmg

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: KeyFix-macos
          path: |
            KeyFix-macos.zip
            KeyFix-macos.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml | head -n1)
          test -n "$version" || { echo 'Could not read pubspec.yaml version.'; exit 1; }
          test "${RELEASE_TAG#v}" = "$version" || { echo "Release tag ${RELEASE_TAG#v} does not match pubspec.yaml version $version."; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libnotify-dev liblzma-dev rpm

      - name: Generate Linux runner
        run: |
          flutter create --platforms=linux --project-name keyfix --org app.keyfix .
          rm -f test/widget_test.dart
          sed -i 's/gboolean use_header_bar = TRUE;/gboolean use_header_bar = FALSE;/' linux/runner/my_application.cc

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build linux --release

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml | head -n1)
          test -n "$version" || { echo 'Could not read pubspec.yaml version.'; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "Release tag ${RELEASE_TAG#v} does not match pubspec.yaml version $version."
            exit 1
          fi
          bundle=build/linux/x64/release/bundle
          tar -C "$(dirname "$bundle")" -czf KeyFix-linux-x64.tar.gz bundle
          bash ci/build_deb.sh "$version" "$bundle" KeyFix-linux-x64.deb
          bash ci/build_rpm.sh "$version" "$bundle" KeyFix-linux-x64.rpm
          bash ci/build_appimage.sh "$bundle" KeyFix-linux-x64.AppImage
          for artifact in KeyFix-linux-x64.tar.gz KeyFix-linux-x64.deb KeyFix-linux-x64.rpm KeyFix-linux-x64.AppImage; do
            test -s "$artifact" || { echo "Missing or empty artifact: $artifact"; exit 1; }
          done

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: KeyFix-linux-x64
          path: |
            KeyFix-linux-x64.tar.gz
            KeyFix-linux-x64.deb
            KeyFix-linux-x64.rpm
            KeyFix-linux-x64.AppImage

  release:
    permissions:
      contents: write
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    needs: [build, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            KeyFix-windows-x64.zip
            KeyFix-Setup-x64.exe
            KeyFix-windows-arm64.zip
            KeyFix-Setup-arm64.exe
            KeyFix-macos.zip
            KeyFix-macos.dmg
            KeyFix-linux-x64.tar.gz
            KeyFix-linux-x64.deb
            KeyFix-linux-x64.rpm
            KeyFix-linux-x64.AppImage
          )
          for name in "${required[@]}"; do
            matches=$(find dist -type f -name "$name" -size +0c | wc -l | tr -d ' ')
            if [[ "$matches" != "1" ]]; then
              echo "Expected exactly one non-empty artifact named $name; found $matches."
              find dist -type f -print | sort
              exit 1
            fi
          done
          echo "Validated all ${#required[@]} required release artifacts."

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \
            \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) | sort)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --title "KeyFix $TAG" --generate-notes --verify-tag
          fi
          gh release view "$TAG" --repo "$REPO" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'

name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install Flutter (ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git $flutterRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned Flutter SDK.' }

          $flutterBin = Join-Path $flutterRoot 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          & (Join-Path $flutterBin 'flutter.bat') --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK could not start.' }

          $dartOutput = & (Join-Path $flutterBin 'dart.bat') --version 2>&1 | Out-String
          Write-Host $dartOutput
          if ($LASTEXITCODE -ne 0 -or $dartOutput -notmatch 'windows_arm64') {
            throw "Flutter did not select the native Windows ARM64 Dart SDK: $dartOutput"
          }

      - name: Validate source and release version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(\d+\.\d+\.\d+)(?:\+(\d+))?\s*$' | Select-Object -First 1
          if (-not $versionLine) { throw 'Could not read a valid version from pubspec.yaml.' }

          $versionMatch = [regex]::Match($versionLine.Line, '^version:\s*(\d+\.\d+\.\d+)(?:\+(\d+))?\s*$')
          $version = $versionMatch.Groups[1].Value
          $buildNumber = $versionMatch.Groups[2].Value
          if ([string]::IsNullOrWhiteSpace($buildNumber)) { $buildNumber = '1' }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Invalid release tag '$env:GITHUB_REF_NAME'. Expected vMAJOR.MINOR.PATCH."
            }
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              throw "Release tag $tagVersion does not match pubspec.yaml version $version. Update the project version before tagging."
            }
          }

          "KEYFIX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KEYFIX_BUILD_NUMBER=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building KeyFix $version+$buildNumber for ${{ matrix.arch }}."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release --build-name "$env:KEYFIX_VERSION" --build-number "$env:KEYFIX_BUILD_NUMBER"

      - name: Package portable build
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "build\windows\${{ matrix.arch }}\runner\Release"
          $executable = Join-Path $releaseDir 'KeyFix.exe'
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Windows release executable was not produced at the expected path: $executable"
          }

          $runtimeFiles = @(Get-ChildItem -Path $releaseDir -File -Recurse)
          if ($runtimeFiles.Count -lt 2) { throw 'Windows release directory is unexpectedly empty or incomplete.' }

          $archive = "KeyFix-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive -PathType Leaf)) { throw 'Portable archive was not produced.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $archive))
          try {
            if (-not ($zip.Entries | Where-Object { $_.FullName -eq 'KeyFix.exe' })) {
              throw 'Portable archive does not contain KeyFix.exe at its root.'
            }
          } finally {
            $zip.Dispose()
          }

      - name: Build installer
        shell: pwsh
        env:
          KEYFIX_ARCH: ${{ matrix.arch }}
        run: |
          function Find-Iscc {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }

            $roots = @(
              ${env:ProgramFiles(x86)},
              $env:ProgramFiles
            ) | Where-Object { $_ -and (Test-Path $_) }

            if ($env:LOCALAPPDATA) {
              $localPrograms = Join-Path $env:LOCALAPPDATA 'Programs'
              if (Test-Path $localPrograms) { $roots += $localPrograms }
            }

            foreach ($root in $roots) {
              foreach ($dir in Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue) {
                $candidate = Join-Path $dir.FullName 'ISCC.exe'
                if (Test-Path $candidate -PathType Leaf) { return $candidate }
              }
            }

            if ($env:ChocolateyInstall) {
              $chocoLib = Join-Path $env:ChocolateyInstall 'lib'
              if (Test-Path $chocoLib) {
                $found = Get-ChildItem -Path $chocoLib -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { return $found.FullName }
              }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }

          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc /Qp KeyFix.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $installer = "Output\KeyFix-Setup-$env:KEYFIX_ARCH.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw "Installer was not produced: $installer" }
          if ((Get-Item $installer).Length -le 0) { throw 'Installer output is empty.' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyFix-windows-${{ matrix.arch }}
          path: |
            KeyFix-windows-${{ matrix.arch }}.zip
            Output/KeyFix-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate all release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "KeyFix-windows-x64.zip"
            "KeyFix-Setup-x64.exe"
            "KeyFix-windows-arm64.zip"
            "KeyFix-Setup-arm64.exe"
          )

          for name in "${expected[@]}"; do
            if [[ ! -s "dist/$name" ]]; then
              echo "Required release artifact is missing or empty: $name" >&2
              exit 1
            fi
          done

          actual_count=$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' \) | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release files, found $actual_count." >&2
            find dist -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

      - name: Publish release without deleting the existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(
            "dist/KeyFix-windows-x64.zip"
            "dist/KeyFix-Setup-x64.exe"
            "dist/KeyFix-windows-arm64.zip"
            "dist/KeyFix-Setup-arm64.exe"
          )

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --title "KeyFix $TAG" --generate-notes
          fi

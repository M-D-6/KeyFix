name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath KeyFix-windows-x64.zip

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:RELEASE_TAG -replace '^v', ''
          }
          $env:KEYFIX_VERSION = $version

          function Find-Iscc {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }

            $roots = @(
              ${env:ProgramFiles(x86)},
              $env:ProgramFiles,
              (Join-Path $env:LOCALAPPDATA 'Programs')
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $roots) {
              foreach ($dir in Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue) {
                $candidate = Join-Path $dir.FullName 'ISCC.exe'
                if (Test-Path $candidate) { return $candidate }
              }
            }

            if ($env:ChocolateyInstall) {
              $found = Get-ChildItem -Path (Join-Path $env:ChocolateyInstall 'lib') -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { return $found.FullName }
            }

            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Get-ChildItem -Path ${env:ProgramFiles(x86)}, $env:ProgramFiles -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw 'Inno Setup compiler was not found.'
          }

          Write-Host "Using $iscc"
          & $iscc /Qp KeyFix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'Output\KeyFix-Setup-x64.exe')) { throw 'Installer was not produced.' }

      - uses: actions/upload-artifact@v4
        with:
          name: KeyFix-windows-x64
          path: |
            KeyFix-windows-x64.zip
            Output/KeyFix-Setup-x64.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" KeyFix-windows-x64.zip Output/KeyFix-Setup-x64.exe --title "KeyFix ${{ github.ref_name }}" --generate-notes

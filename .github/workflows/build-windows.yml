name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          cache: true

      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $flutterBin = "$env:RUNNER_TEMP\flutter\bin"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          & "$flutterBin\flutter.bat" --version
          $dart = & "$flutterBin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dart
          if ($dart -notmatch 'windows_arm64') { throw "Flutter picked a non-arm64 Dart SDK: $dart" }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path "build\windows\${{ matrix.arch }}\runner\Release\*" -DestinationPath "KeyFix-windows-${{ matrix.arch }}.zip"

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          KEYFIX_ARCH: ${{ matrix.arch }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:RELEASE_TAG -replace '^v', ''
          }
          $env:KEYFIX_VERSION = $version

          function Find-Iscc {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }

            $roots = @(
              ${env:ProgramFiles(x86)},
              $env:ProgramFiles,
              (Join-Path $env:LOCALAPPDATA 'Programs')
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $roots) {
              foreach ($dir in Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue) {
                $candidate = Join-Path $dir.FullName 'ISCC.exe'
                if (Test-Path $candidate) { return $candidate }
              }
            }

            if ($env:ChocolateyInstall) {
              $found = Get-ChildItem -Path (Join-Path $env:ChocolateyInstall 'lib') -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { return $found.FullName }
            }

            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Get-ChildItem -Path ${env:ProgramFiles(x86)}, $env:ProgramFiles -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw 'Inno Setup compiler was not found.'
          }

          Write-Host "Using $iscc"
          & $iscc /Qp KeyFix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "Output\KeyFix-Setup-$env:KEYFIX_ARCH.exe")) { throw 'Installer was not produced.' }

      - uses: actions/upload-artifact@v4
        with:
          name: KeyFix-windows-${{ matrix.arch }}
          path: |
            KeyFix-windows-${{ matrix.arch }}.zip
            Output/KeyFix-Setup-${{ matrix.arch }}.exe

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate macOS runner
        run: |
          flutter create --platforms=macos --project-name keyfix --org app.keyfix .
          rm -f test/widget_test.dart
          cp ci/macos/AppDelegate.swift macos/Runner/AppDelegate.swift
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = KeyFix/' macos/Runner/Configs/AppInfo.xcconfig
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c 'Set :com.apple.security.app-sandbox false' "$f"
          done
          icons=macos/Runner/Assets.xcassets/AppIcon.appiconset
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size docs/logo.png --out "$icons/app_icon_$size.png" >/dev/null
          done

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build macos --release

      - name: Package
        run: |
          app="build/macos/Build/Products/Release/KeyFix.app"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" KeyFix-macos.zip
          mkdir dmg && cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname KeyFix -srcfolder dmg -ov -format UDZO KeyFix-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: KeyFix-macos
          path: |
            KeyFix-macos.zip
            KeyFix-macos.dmg

  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libnotify-dev liblzma-dev rpm

      - name: Generate Linux runner
        run: |
          flutter create --platforms=linux --project-name keyfix --org app.keyfix .
          rm -f test/widget_test.dart
          sed -i 's/gboolean use_header_bar = TRUE;/gboolean use_header_bar = FALSE;/' linux/runner/my_application.cc

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build linux --release

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${RELEASE_TAG#v}"; fi
          bundle=build/linux/x64/release/bundle
          tar -C "$(dirname "$bundle")" -czf KeyFix-linux-x64.tar.gz bundle
          ci/build_deb.sh "$version" "$bundle" KeyFix-linux-x64.deb
          ci/build_rpm.sh "$version" "$bundle" KeyFix-linux-x64.rpm
          ci/build_appimage.sh "$bundle" KeyFix-linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: KeyFix-linux-x64
          path: |
            KeyFix-linux-x64.tar.gz
            KeyFix-linux-x64.deb
            KeyFix-linux-x64.rpm
            KeyFix-linux-x64.AppImage

  release:
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) | sort)
          printf '%s\n' "${files[@]}"

          for id in $(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id'); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done

          gh release create "$TAG" "${files[@]}" --repo "$REPO" --title "KeyFix $TAG" --generate-notes --verify-tag
          gh release view "$TAG" --repo "$REPO" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
